<html>
<script src='https://d3js.org/d3.v5.min.js'></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3-annotation/2.5.1/d3-annotation.min.js"></script>
<style> circle {fill: lightblue; stroke: black;} </style>
<body onload='init()'>
 <h1> THIS IS THE First PAGE</h1>
<svg width=1200 height=900>
</svg>
<script>
async function init() {
 const data = await d3.csv('https://flunky.github.io/cars2017.csv');
 const gData = data.filter(d => d.Fuel === 'Gasoline');
 const dData = data.filter(d => d.Fuel === 'Diesel');
 const eData = data.filter(d => d.Fuel === 'Electricity');
const x = d3.scaleLog()
 .domain([10,150])
 .range([0,600]);
const y = d3.scaleLog()
 .domain([10,150])
 .range([600,0]);


const annotations = [{
  note: {
    label: "Engines with fewer cylinders tend to have higher MPG",
    bgPadding: 20,
    title: "0 Cylinder Enginges"
  },
  //can use x, y directly instead of data
  x: 450 + x(d3.mean(eData, d => d.AverageCityMPG)),
  y: 150 + y(d3.mean(eData, d => d.AverageHighwayMPG)),
  dy: 137,
  dx: 0
},
{
  note: {
    label: "Its Gas",
    bgPadding: 20,
    title: "Second Annotation"
  },
  //can use x, y directly instead of data
  x: 450 + x(d3.mean(gData, d => d.AverageCityMPG)),
  y: 150 + y(d3.mean(gData, d => d.AverageHighwayMPG)),
  dy: 137,
  dx: 162
},
{
  note: {
    label: "Its diesel",
    bgPadding: 20,
    title: "Third Annotation"
  },
  //can use x, y directly instead of data
  x: 450 + x(d3.mean(dData, d => d.AverageCityMPG)),
  y: 150 + y(d3.mean(dData, d => d.AverageHighwayMPG)),
  dy: 87,
  dx: 142
}                     
];

const makeAnnotations = d3.annotation()
  .annotations(annotations);
d3.select("svg")
  .append("g")
  .call(makeAnnotations)

d3.select('svg')
 .append('g')
  .attr("transform","translate(450,150)")
  .selectAll("circle")
  .data(data)
  .enter()
  .append("circle")
   .attr("cx", function(d,i) {return x(d.AverageCityMPG)})
   .attr("cy", function(d,i) {return y(d.AverageHighwayMPG)})
   .attr("r", function(d,i) {return 2+Number((d.EngineCylinders))});


const yAxis = d3.axisLeft(y).tickValues([10,20,50,100]).tickFormat(d3.format("~s"))

d3.select('svg')
.append('g')
 .attr("transform","translate(450,150)")
 .call(yAxis);

d3.select('svg')
 .append('g')
  .attr("transform","rotate(-90)")
  .text('Y-Axis Label')

const xAxis = d3.axisBottom(x).tickValues([10,20,50,100]).tickFormat(d3.format("~s"))

d3.select('svg')
.append('g')
 .attr("transform","translate(450,750)")
 .call(xAxis);

d3.select('svg')
 .append('g')
  .text('X-Axis Label')

}
</script>
<a href="second_page.html">Go to Second Page</a>
</body>
</html>
