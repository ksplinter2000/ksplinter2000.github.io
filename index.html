<html>
<script src='https://d3js.org/d3.v5.min.js'></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3-annotation/2.5.1/d3-annotation.min.js"></script>
<style> circle {fill: lightblue; stroke: black;} </style>
<body onload='init()'>
 <h1> THIS IS THE First PAGE</h1>

 <button class="nav-button" onclick="window.location.href='index.html'">1</button>
 <button class="nav-button" onclick="window.location.href='second_page.html'">2</button>
 <button class="nav-button" onclick="window.location.href='third_page.html'">3</button>
 
 <p><br></p>
<svg width=1200 height=800>
</svg>
<script>
async function init() {
 const data = await d3.csv('https://flunky.github.io/cars2017.csv');
 const gData = data.filter(d => d.Fuel === 'Gasoline');
 const dData = data.filter(d => d.Fuel === 'Diesel');
 const eData = data.filter(d => d.Fuel === 'Electricity');
const x = d3.scaleLog()
 .domain([10,150])
 .range([0,600]);
const y = d3.scaleLog()
 .domain([10,150])
 .range([600,0]);




d3.select('svg')
 .append('g')
  .attr("transform","translate(450,50)")
  .selectAll("circle")
  .data(data)
  .enter()
  .append("circle")
   .attr("cx", function(d,i) {return x(d.AverageCityMPG)})
   .attr("cy", function(d,i) {return y(d.AverageHighwayMPG)})
   .attr("r", function(d,i) {return 4+2*Number((d.EngineCylinders))})
   .append("title")
   .text(d => `Make: ${d.Make}   City: ${d.AverageCityMPG}   Highway: ${d.AverageHighwayMPG}`)
 ;


const yAxis = d3.axisLeft(y).tickValues([10,20,50,100]).tickFormat(d3.format("~s"))

d3.select('svg')
.append('g')
 .attr("transform","translate(450,50)")
 .call(yAxis);

d3.select('svg')
 .append("text")
    .attr("class", "x label")
    .attr("text-anchor", "start")
    .attr("x", 625)
    .attr("y", 700)
    .text("Average Miles Per Gallon (City Driving)");

 d3.select('svg')
 .append("text")
    .attr("class", "y label")
    .attr("text-anchor", "end")
    .attr("x", 325)
    .attr("y", 350)
    .text("Average Miles Per Gallon (Highway Driving)");

const xAxis = d3.axisBottom(x).tickValues([10,20,50,100]).tickFormat(d3.format("~s"))

d3.select('svg')
.append('g')
 .attr("transform","translate(450,650)")
 .call(xAxis);


const annotations = [{
  note: {
    label: "City MPG: 150    Highway MPG: 122",
    bgPadding: 20,
    wrap: 125,
    title: "Hyundai Electric"
  },
  //can use x, y directly instead of data
  x: 450 + x(150),
  y: 50 + y(122),
  dy: 100,
  dx: -35
},
{
  note: {
    label: "Cars with more cylinders are represented by larger circles",
    bgPadding: 20,
    wrap: 200,
    title: "Engine Cylinder Count"
  },
  //can use x, y directly instead of data
  x: 695,
  y: 350,
  dy: 70,
  dx: 80
},
{
  note: {
    label: "City MPG: 10 Highway MPG: 17",
    bgPadding: 20,
    wrap: 125,
    title: "Lamborghini Gasoline"
  },
  //can use x, y directly instead of data
  x: 450 + x(10),
  y: 50 + y(17),
  dy: 30,
  dx: 70
}                     
];

const makeAnnotations = d3.annotation()
  .annotations(annotations);
d3.select("svg")
  .append("g")
  .call(makeAnnotations)

 // .text("Go to Second Slide")
 // .on("click", function() {
    // Redirects the current tab to the new page
    //window.location.href = "second_page.html"; 
  //});

}
</script>
</body>
</html>
