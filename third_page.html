<html>
<script src='https://d3js.org/d3.v5.min.js'></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3-annotation/2.5.1/d3-annotation.min.js"></script>
<style> circle {fill: lightblue; stroke: black;} </style>
<body onload='init()'>
<h1 style = "text-align: center;"> Electric Motors Buck the Trend, City More Efficient</h1>

 <button class="nav-button" onclick="window.location.href='index.html'">1</button>
 <button class="nav-button" onclick="window.location.href='second_page.html'">2</button>
 <button class="nav-button" onclick="window.location.href='third_page.html'">3</button>
 <p><br></p>
<svg width=1200 height=800>
</svg>
<script>
async function init() {
 const data = await d3.csv('https://flunky.github.io/cars2017.csv');
 const gData = data.filter(d => d.Fuel === 'Gasoline');
 const dData = data.filter(d => d.Fuel === 'Diesel');
 const eData = data.filter(d => d.Fuel === 'Electricity');
const x = d3.scaleLog()
 .domain([10,150])
 .range([0,600]);
const y = d3.scaleLog()
 .domain([10,150])
 .range([600,0]);



d3.select('svg')
 .append('g')
  .attr("transform","translate(450,50)")
  .selectAll("circle")
  .data(gData)
  .enter()
  .append("circle")
   .attr("cx", function(d,i) {return x(d.AverageCityMPG)})
   .attr("cy", function(d,i) {return y(d.AverageHighwayMPG)})
   .attr("r", function(d,i) {return 4+(2*Number((d.EngineCylinders)))})
   .style("fill", "green")
   .append("title")
   .text(d => `Make: ${d.Make}   City: ${d.AverageCityMPG}   Highway: ${d.AverageHighwayMPG}`);

d3.select('svg')
 .append('g')
  .attr("transform","translate(450,50)")
  .selectAll("circle")
  .data(dData)
  .enter()
  .append("circle")
   .attr("cx", function(d,i) {return x(d.AverageCityMPG)})
   .attr("cy", function(d,i) {return y(d.AverageHighwayMPG)})
   .attr("r", function(d,i) {return 4+(2*Number((d.EngineCylinders)))})
   .style("fill", "grey")
   .append("title")
   .text(d => `Make: ${d.Make}   City: ${d.AverageCityMPG}   Highway: ${d.AverageHighwayMPG}`);

  
d3.select('svg')
 .append('g')
  .attr("transform","translate(450,50)")
  .selectAll("circle")
  .data(eData)
  .enter()
  .append("circle")
   .attr("cx", function(d,i) {return x(d.AverageCityMPG)})
   .attr("cy", function(d,i) {return y(d.AverageHighwayMPG)})
   .attr("r", function(d,i) {return 4+(2*Number((d.EngineCylinders)))})
   .style("fill", "red")
   .append("title")
   .text(d => `Make: ${d.Make}   City: ${d.AverageCityMPG}   Highway: ${d.AverageHighwayMPG}`);


const yAxis = d3.axisLeft(y).tickValues([10,20,50,100]).tickFormat(d3.format("~s"))

d3.select('svg')
.append('g')
 .attr("transform","translate(450,50)")
 .call(yAxis);

const xAxis = d3.axisBottom(x).tickValues([10,20,50,100]).tickFormat(d3.format("~s"))

d3.select('svg')
.append('g')
 .attr("transform","translate(450,650)")
 .call(xAxis);



const annotations = [{
  note: {
    label: "Almost All Average Better MPG in City",
    bgPadding: 20,
    wrap: 200,
    title: "Electric Motors"
  },
  //can use x, y directly instead of data
  x: 450 + x(d3.mean(eData, d => d.AverageCityMPG)),
  y: 50 + y(d3.mean(eData, d => d.AverageHighwayMPG)),
  dy: 80,
  dx: 0
},
{
  note: {
    label: "Vast Majority Average Better MPG on Highway",
    bgPadding: 20,
    wrap: 200,
    title: "Gas and Diesel Motors"
  },
  //can use x, y directly instead of data
  x: 450 + x(d3.mean(gData, d => d.AverageCityMPG)),
  y: 50 + y(d3.mean(gData, d => d.AverageHighwayMPG)),
  dy: -200,
  dx: 10
}                     
];

const makeAnnotations = d3.annotation()
  .annotations(annotations);
d3.select("svg")
  .append("g")
  .call(makeAnnotations)

d3.select('svg')
 .append("text")
    .attr("class", "x label")
    .attr("text-anchor", "start")
    .attr("x", 625)
    .attr("y", 700)
    .text("Average Miles Per Gallon (City Driving)");

 d3.select('svg')
 .append("text")
    .attr("class", "y label")
    .attr("text-anchor", "end")
    .attr("x", 325)
    .attr("y", 350)
    .text("Average Miles Per Gallon (Highway Driving)");

  d3.select('svg')
  .append("line")
    .attr("x1", 450 + x(10))
    .attr("y1", 50 + y(10))
    .attr("x2", 450 + x(150))
    .attr("y2", 50 + y(150))
    .attr("stroke", "#999")
    .attr("stroke-width", 1.5)
    .attr("stroke-dasharray", "4"); // Optional dashed style
   
 
}
</script>

</body>
</html>
