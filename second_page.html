<html>
<script src='https://d3js.org/d3.v5.min.js'></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3-annotation/2.5.1/d3-annotation.min.js"></script>
<style> circle {fill: lightblue; stroke: black;} </style>
<body onload='init()'>
 <h1 style = "text-align: center;"> Averages Vehicles For Each Type of Fuel</h1>

 <button class="nav-button" onclick="window.location.href='index.html'">1</button>
 <button class="nav-button" onclick="window.location.href='second_page.html'">2</button>
 <button class="nav-button" onclick="window.location.href='third_page.html'">3</button>
 <p><br></p>
<svg width=1200 height=800>
</svg>
<script>
async function init() {
 const data = await d3.csv('https://flunky.github.io/cars2017.csv');
 const gData = data.filter(d => d.Fuel === 'Gasoline');
 const dData = data.filter(d => d.Fuel === 'Diesel');
 const eData = data.filter(d => d.Fuel === 'Electricity');
 
  
const x = d3.scaleLog()
 .domain([10,150])
 .range([0,600]);
const y = d3.scaleLog()
 .domain([10,150])
 .range([600,0]);


 const gCity = d3.mean(gData, d => d.AverageCityMPG);
 const gHighway = d3.mean(gData, d => d.AverageHighwayMPG);
 const dCity = d3.mean(dData, d => d.AverageCityMPG);
 const dHighway = d3.mean(dData, d => d.AverageHighwayMPG);
 const eCity = d3.mean(eData, d => d.AverageCityMPG);
 const eHighway = d3.mean(eData, d => d.AverageHighwayMPG);


d3.select('svg')
 .append('g')
  .attr("transform","translate(450,50)")
  .selectAll("circle")
  .data(data)
  .enter()
  .append("circle")
   .attr("cx", function(d,i) {return x(d.AverageCityMPG)})
   .attr("cy", function(d,i) {return y(d.AverageHighwayMPG)})
   .attr("r", function(d,i) {return 4+(2*Number((d.EngineCylinders)))})
   .append("title")
   .text(d => `Make: ${d.Make}   City: ${d.AverageCityMPG}   Highway: ${d.AverageHighwayMPG}`);

 d3.select('svg')
 .append('g')
  .attr("transform","translate(450,50)")
  .append("circle")
   .attr("cx", function(d,i) {return x(gCity)})
   .attr("cy", function(d,i) {return y(gHighway)})
   .attr("r", function(d,i) {return 4+(2*Number((d3.mean(gData, d => d.EngineCylinders))))})
   .style("fill", "green")
   .append("title")
   .text(d => `Fuel: Gasoline   City: ${gCity}   Highway: ${gHighway}`)
   ;

  d3.select('svg')
 .append('g')
  .attr("transform","translate(450,50)")
  .append("circle")
   .attr("cx", function(d,i) {return x(dCity)})
   .attr("cy", function(d,i) {return y(dHighway)})
   .attr("r", function(d,i) {return 4+(2*Number((d3.mean(dData, d => d.EngineCylinders))))})
   .style("fill", "grey")
   .append("title")
   .text(d => `Fuel: Diesel   City: ${dCity}   Highway: ${dHighway}`)
   ;

  d3.select('svg')
 .append('g')
  .attr("transform","translate(450,50)")
  .append("circle")
   .attr("cx", function(d,i) {return x(eCity)})
   .attr("cy", function(d,i) {return y(eHighway)})
   .attr("r", function(d,i) {return 4+(2*Number((d3.mean(eData, d => d.EngineCylinders))))})
   .style("fill", "red")
   .append("title")
   .text(d => `Fuel: Electric   City: ${eCity}   Highway: ${eHighway}`)
   ;

const yAxis = d3.axisLeft(y).tickValues([10,20,50,100]).tickFormat(d3.format("~s"))

d3.select('svg')
.append('g')
 .attr("transform","translate(450,50)")
 .call(yAxis);

const xAxis = d3.axisBottom(x).tickValues([10,20,50,100]).tickFormat(d3.format("~s"))

d3.select('svg')
.append('g')
 .attr("transform","translate(450,650)")
 .call(xAxis);



const annotations = [{
  note: {
    label: "Substantially Higher Efficency than Other Fuels",
    bgPadding: 20,
    wrap: 200,
    title: "Average Electric Motor"
  },
  //can use x, y directly instead of data
  x: 450 + x(eCity),
  y: 50 + y(eHighway),
  dy: 80,
  dx: 0
},
{
  note: {
    label: "Lowest Efficiency Across Fuel Types",
    bgPadding: 20,
    wrap: 200,
    title: "Average Gas Motor"
  },
  //can use x, y directly instead of data
  x: 450 + x(gCity),
  y: 50 + y(gHighway),
  dy: 137,
  dx: 80
},
{
  note: {
    label: "More Efficient than Gasoline, but Far Below Electric",
    bgPadding: 20,
    wrap: 200,
    title: "Average Diesel Motor"
  },
  //can use x, y directly instead of data
  x: 450 + x(dCity),
  y: 50 + y(dHighway),
  dy: 30,
  dx: 120
}                     
];

const makeAnnotations = d3.annotation()
  .annotations(annotations);
d3.select("svg")
  .append("g")
  .call(makeAnnotations)

d3.select('svg')
 .append("text")
    .attr("class", "x label")
    .attr("text-anchor", "start")
    .attr("x", 625)
    .attr("y", 700)
    .text("Average Miles Per Gallon (City Driving)");

 d3.select('svg')
 .append("text")
    .attr("class", "y label")
    .attr("text-anchor", "end")
    .attr("x", 325)
    .attr("y", 350)
    .text("Average Miles Per Gallon (Highway Driving)");
 
}
</script>

</body>
</html>
